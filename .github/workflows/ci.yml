name: D22 CI Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  test:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Unit Test
        run: python -m pytest test_app.py

      - name: Run Performance Test
        run: python performance_test.py

      - name: Run Load Test
        run: python load_test.py